<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#07070a">
    <meta name="description" content="Digite igual um nóia: o Tony transforma seu texto em tonyzês ou miguxês, fala com a voz dele e você manda no Zap.">
    <title>Tonyzês</title>

    <!-- Ícone -->
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Prévia ao compartilhar o link (WhatsApp, Telegram, redes sociais) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tonyzês">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:url" content="https://tonynozap.netlify.app/">
    <meta property="og:title" content="Tonyzês: digite igual um nóia">
    <meta property="og:description" content="O Tony transforma seu texto em tonyzês ou miguxês, fala com a voz dele e você manda direto no Zap.">
    <meta property="og:image" content="https://tonynozap.netlify.app/og-rasta.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="O Tony, de barba e cabelo comprido, ao lado do título Tonyzês">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <style>
        :root {
            --bg: #07070a;
            --surface: #0e0e12;
            --surface-2: #14141a;
            --line: #23232b;
            --line-strong: #34343f;
            --text: #ececf1;
            --text-2: #a3a3b0;
            --text-3: #8a8a98;
            --accent: #e5383b;
            --accent-soft: rgba(229, 56, 59, 0.14);
            --accent-line: rgba(229, 56, 59, 0.45);
            --tony: #2fd27a;
            --tony-soft: rgba(47, 210, 122, 0.12);
            --tony-line: rgba(47, 210, 122, 0.45);
            --radius: 6px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --font: 'Geist', system-ui, sans-serif;
            --mono: 'Geist Mono', ui-monospace, monospace;
            --display: 'Orbitron', var(--font);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; }

        body {
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--accent); color: #fff; }

        /* ---------- Camadas de fundo ---------- */
        #stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .station {
            position: fixed;
            top: -14vmin;
            right: -12vmin;
            width: 58vmin;
            max-width: 560px;
            min-width: 260px;
            opacity: 0.5;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(120% 80% at 50% 110%, rgba(229, 56, 59, 0.08), transparent 60%),
                radial-gradient(90% 70% at 50% 50%, transparent 40%, rgba(7, 7, 10, 0.85) 100%);
        }

        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.05;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        /* Container que cobre a tela para a nave voar dentro */
        .tie-fighter-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Garante que a nave não atrapalhe cliques no site */
            z-index: 9999; /* Deixa a nave por cima de todo o conteúdo */
            overflow: hidden;
        }

        /* Animação do trajeto (cruzando a tela) */
        @keyframes flyAcross {
            0% { transform: translateX(-150px) translateY(20vh) scale(0.8) rotate(15deg); }
            100% { transform: translateX(110vw) translateY(-10vh) scale(0.4) rotate(-10deg); }
        }

        /* Aplicação da animação na nave */
        .tie-fighter {
            position: absolute;
            transform: translateX(-150px) translateY(20vh);
            /* Mude o "12s" para mais ou menos se quiser alterar a velocidade do voo */
            animation: flyAcross 12s linear infinite;
        }

        /* Tamanho do SVG e efeito de sombra brilhante vermelha */
        .tie-fighter-svg {
            display: block;
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.5));
        }

        /* Animação piscante da "janela" (olho vermelho) */
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .window-pulse {
            animation: pulse-red 2s infinite;
        }

        /* Quem pediu menos animação no sistema não vê a nave */
        @media (prefers-reduced-motion: reduce) {
            .tie-fighter-container { display: none; }
        }

        /* ---------- Layout ---------- */
        .shell {
            position: relative;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }
        @media (min-width: 768px) { .shell { padding: 0 32px; } }

        /* ---------- Cabeçalho ---------- */
        .intro {
            padding: 56px 0 28px;
            display: grid;
            gap: 14px;
        }
        @media (min-width: 768px) { .intro { padding: 88px 0 36px; } }

        .signal {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .signal .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
        .signal .bars i {
            display: block;
            width: 3px;
            background: var(--accent);
            border-radius: 1px;
        }
        .signal .bars i:nth-child(1) { height: 4px; }
        .signal .bars i:nth-child(2) { height: 7px; }
        .signal .bars i:nth-child(3) { height: 10px; }
        .signal .bars i:nth-child(4) { height: 12px; opacity: 0.35; }
        @media (prefers-reduced-motion: no-preference) {
            .signal .bars i:nth-child(4) { animation: blink 2.4s steps(1) infinite; }
        }
        @keyframes blink { 50% { opacity: 1; } }

        h1 {
            margin: 0;
            font-family: var(--display);
            font-weight: 900;
            font-size: clamp(2rem, 7vw, 4.75rem);
            line-height: 1;
            letter-spacing: 0.01em;
            color: var(--text);
            text-shadow: 0 0 40px rgba(229, 56, 59, 0.25);
        }
        h1 .marks {
            font-family: var(--font);
            font-weight: 300;
            font-size: 0.42em;
            vertical-align: 0.95em;
            margin-left: 0.25em;
            color: var(--text-3);
            letter-spacing: 0.1em;
            text-shadow: none;
        }

        .lede {
            margin: 0;
            max-width: 46ch;
            color: var(--text-2);
            font-size: clamp(0.95rem, 1.6vw, 1.125rem);
        }

        /* ---------- Alternador de fluxo (modo reverso) ---------- */
        .flow {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin: 0 0 12px;
        }
        .flow-hint { font-size: 12px; color: var(--text-3); }
        .flow-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            height: 38px;
            padding: 0 14px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: rgba(14, 14, 18, 0.8);
            color: var(--text);
            font: 500 13px var(--font);
            cursor: pointer;
            transition: border-color .2s var(--ease), background-color .2s var(--ease), transform .15s var(--ease);
        }
        .flow-toggle i { font-size: 16px; color: var(--accent); transition: transform .4s var(--ease); }
        .flow-toggle:hover { border-color: var(--accent-line); }
        .flow-toggle:active { transform: scale(0.98); }
        .flow-toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
        .flow-toggle[aria-pressed="true"] i { transform: rotate(180deg); }
        .flow-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ---------- Console ---------- */
        .console {
            position: relative;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: linear-gradient(180deg, rgba(20, 20, 26, 0.82), rgba(12, 12, 16, 0.88));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 40px 80px -30px rgba(0, 0, 0, 0.9);
        }

        .panes {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .pane + .pane { border-left: 1px solid var(--line); }

        .pane-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 48px;
            padding: 8px 10px 8px 14px;
            border-bottom: 1px solid var(--line);
        }
        @media (min-width: 768px) { .pane-head { padding: 10px 12px 10px 20px; } }

        .pane-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
        }
        .pane-title .dialect {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 520px) { .pane-title .dialect { display: none; } }

        .tools { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 32px;
            min-width: 32px;
            padding: 0 8px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-2);
            font: 500 12px var(--font);
            cursor: pointer;
            transition: color .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
        }
        .icon-btn i { font-size: 16px; }
        .icon-btn:hover { color: var(--text); background: var(--surface-2); border-color: var(--line); }
        .icon-btn:active { transform: scale(0.96); }
        .icon-btn:disabled { opacity: 0.35; pointer-events: none; }
        .icon-btn .label { display: none; }
        @media (min-width: 768px) { .icon-btn .label { display: inline; } }

        .count {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-3);
            padding: 0 6px;
        }
        @media (max-width: 520px) { .count { display: none; } }

        .field {
            position: relative;
            flex: 1;
        }

        textarea, .output {
            display: block;
            width: 100%;
            height: clamp(220px, 42vh, 380px);
            margin: 0;
            padding: 14px;
            border: 0;
            background: transparent;
            color: var(--text);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.7;
            resize: none;
            overflow-y: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        @media (min-width: 768px) {
            textarea, .output { padding: 20px; font-size: 14px; }
        }
        /* iOS dá zoom automático em campos com fonte < 16px */
        @media (max-width: 767px) {
            textarea, .output { padding: 12px; font-size: 16px; line-height: 1.55; }
        }
        textarea::placeholder { color: var(--text-2); transition: color .15s var(--ease); }
        /* Ao clicar na caixa, o texto de instrução some */
        textarea:focus::placeholder { color: transparent; }
        textarea:focus { outline: none; }
        .pane:focus-within .pane-head { border-bottom-color: var(--line-strong); }

        .output { color: #f4b8b9; }
        /* Mensagens da caixa da direita usam a mesma fonte, tamanho e posição da caixa da esquerda */
        .output .empty {
            font: inherit;
            color: var(--text-2);
        }
        .output .empty i { display: none; }
        .output.is-empty, .output.is-error { white-space: normal; }
        .output.is-error .empty { color: var(--accent); }
        .output.is-error .empty i { color: var(--accent); }

        /* scanline durante decodificação */
        .pane-out .field::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            pointer-events: none;
        }
        @media (prefers-reduced-motion: no-preference) {
            .pane-out.decoding .field::after { animation: scan .7s var(--ease); }
        }
        @keyframes scan {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(clamp(220px, 42vh, 380px)); }
        }

        /* ---------- Canais (dialetos) ---------- */
        .channels {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--line);
        }

        .channel {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            column-gap: 12px;
            padding: 14px;
            border: 0;
            background: transparent;
            color: var(--text-2);
            text-align: left;
            cursor: pointer;
            transition: background-color .25s var(--ease), color .25s var(--ease);
        }
        @media (min-width: 768px) { .channel { padding: 18px 20px; } }
        /* Tony ocupa a linha inteira em cima; os 3 dialetos ficam lado a lado embaixo */
        .channel { border-left: 1px solid var(--line); }
        .tony-bar + .channel { border-left: 0; }

        .channel .glyph {
            grid-row: span 2;
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            font-size: 18px;
            color: var(--text-2);
            transition: border-color .25s var(--ease), color .25s var(--ease), background-color .25s var(--ease), transform .3s var(--ease);
        }
        .channel { min-width: 0; }
        .channel .name {
            min-width: 0;
            font-family: var(--display);
            font-weight: 800;
            font-size: 10px;
            line-height: 1.3;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text);
        }
        /* Celular: dialetos pequenos com ícone em cima do nome */
        @media (max-width: 520px) {
            .channel:not(.tony) {
                grid-template-columns: 1fr;
                justify-items: center;
                row-gap: 6px;
                padding: 12px 6px;
                text-align: center;
            }
            .channel:not(.tony) .glyph { grid-row: auto; width: 30px; height: 30px; font-size: 15px; }
        }
        @media (min-width: 768px) { .channel .name { font-size: 12px; letter-spacing: 0.08em; white-space: nowrap; } }
        .channel .era {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-3);
        }
        .channel kbd {
            display: none;
            position: absolute;
            top: 10px;
            right: 12px;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-3);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 0 4px;
        }
        @media (min-width: 1024px) {
            .channel { padding-right: 32px; }
            .channel kbd { display: block; }
        }

        .channel::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .45s var(--ease);
        }
        .channel:hover { background: rgba(255, 255, 255, 0.02); color: var(--text); }
        .channel:hover .glyph { border-color: var(--accent-line); color: var(--text); }
        .channel:active .glyph { transform: scale(0.94); }
        .channel[aria-pressed="true"] { background: var(--accent-soft); }
        .channel[aria-pressed="true"]::before { transform: scaleX(1); }
        .channel[aria-pressed="true"] .glyph { border-color: var(--accent); background: var(--accent); color: #fff; }
        .channel[aria-pressed="true"] .era { color: #f4b8b9; }

        /* Tony MCL: canal verde */
        /* Barra verde: Tony MCL + TonyZator (áudio) + Copiar, com a fumaça por trás de tudo */
        .tony-bar {
            grid-column: 1 / -1;
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-areas: "tony" "tts";
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(47, 210, 122, 0.06), rgba(47, 210, 122, 0.16));
            overflow: hidden;
            isolation: isolate;
        }
        @media (min-width: 768px) {
            .tony-bar { grid-template-columns: 1fr 1fr; grid-template-areas: "tony tts"; }
        }
        .channel.tony {
            grid-area: tony;
            border-left: 0;
            column-gap: 16px;
            padding: 20px 18px;
            background: transparent;
            z-index: 1;
        }
        @media (min-width: 768px) {
            .channel.tony { column-gap: 22px; padding: 30px 32px; }
        }
        .channel.tts {
            grid-area: tts;
            border-top: 1px solid rgba(47, 210, 122, 0.25);
            padding: 12px 18px;
        }
        @media (min-width: 768px) {
            .channel.tts { border-top: 0; border-left: 1px solid rgba(47, 210, 122, 0.25); padding: 30px 32px; }
        }
        .channel.tts:disabled { cursor: default; }
        .channel.tts:disabled .glyph, .channel.tts:disabled .name, .channel.tts:disabled .era { opacity: 0.45; }
        .channel.tts.is-loading .glyph i { animation: spin 1s linear infinite; }

        .bar-tools {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 2;
            display: flex;
            align-items: center;
        }
        .bar-tools kbd {
            display: none;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--tony);
            border: 1px solid var(--tony-line);
            border-radius: 3px;
            padding: 0 4px;
        }
        @media (min-width: 1024px) { .bar-tools kbd { display: block; } }
        .bar-copy {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 10px;
            border: 1px solid var(--tony-line);
            border-radius: var(--radius);
            background: rgba(4, 19, 10, 0.45);
            color: var(--tony);
            font: 500 12px var(--font);
            cursor: pointer;
            transition: border-color .2s var(--ease), background-color .2s var(--ease), transform .15s var(--ease);
        }
        .bar-copy i { font-size: 15px; }
        .bar-copy:hover { border-color: var(--tony); background: rgba(47, 210, 122, 0.14); }
        .bar-copy:active { transform: scale(0.97); }
        .bar-copy:disabled { opacity: 0.4; pointer-events: none; }
        .bar-copy .short { display: none; }
        @media (max-width: 767px) {
            .bar-copy .long { display: none; }
            .bar-copy .short { display: inline; }
        }
        /* Carro-chefe: tudo maior */
        .channel.tony .glyph { width: 52px; height: 52px; font-size: 26px; }
        @media (min-width: 768px) { .channel.tony .glyph { width: 64px; height: 64px; font-size: 32px; } }
        .channel.tony .name {
            font-size: clamp(20px, 4vw, 32px);
            letter-spacing: 0.06em;
            line-height: 1.1;
            white-space: nowrap;
        }
        .channel.tony .era { font-size: 12px; margin-top: 4px; }
        @media (min-width: 768px) { .channel.tony .era { font-size: 13px; } }
        /* TonyZator menor no celular */
        @media (max-width: 767px) {
            .channel.tts .glyph { width: 36px; height: 36px; font-size: 18px; }
            .channel.tts .name { font-size: 16px; }
            .channel.tts .era { font-size: 11px; margin-top: 2px; }
        }
        .tony-bar .smoke span { width: 90px; height: 90px; bottom: -50px; filter: blur(9px); }
        .channel.tony:hover { background: rgba(47, 210, 122, 0.07); }
        .channel.tony::before { z-index: 2; }

        /* Fumacinha subindo pelo botão inteiro */
        .smoke { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
        .smoke span {
            position: absolute;
            bottom: -34px;
            left: var(--x);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(225, 255, 235, 0.34), rgba(160, 240, 190, 0.12) 45%, transparent 70%);
            filter: blur(7px);
            opacity: 0;
        }
        @media (prefers-reduced-motion: no-preference) {
            .smoke span { animation: puff var(--d) ease-out infinite var(--delay); }
        }
        @media (prefers-reduced-motion: reduce) {

    <script>
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ================= Céu estrelado ================= */
        (function starfield() {
            const canvas = document.getElementById('stars');
            const ctx = canvas.getContext('2d');
            let stars = [], w = 0, h = 0, dpr = 1;

            function build() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const total = Math.round((w * h) / 2600);
                stars = Array.from({ length: total }, () => {
                    const depth = Math.random();
                    return {
                        x: Math.random() * w,
                        y: Math.random() * h,
                        r: depth * 1.3 + 0.2,
                        a: depth * 0.7 + 0.15,
                        v: depth * 0.12 + 0.01,
                        t: Math.random() * Math.PI * 2,
                        red: Math.random() < 0.03
                    };
                });
            }

            function draw(time) {
                ctx.clearRect(0, 0, w, h);
                for (const s of stars) {
                    if (!reduceMotion) {
                        s.x -= s.v;
                        if (s.x < -2) s.x = w + 2;
                    }
                    const tw = reduceMotion ? 1 : 0.75 + Math.sin(time / 900 + s.t) * 0.25;
                    ctx.globalAlpha = s.a * tw;
                    ctx.fillStyle = s.red ? '#ff8a8c' : '#e8e8f2';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                if (!reduceMotion) requestAnimationFrame(draw);
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => { build(); if (reduceMotion) draw(0); }, 150);
            });

            build();
            reduceMotion ? draw(0) : requestAnimationFrame(draw);
        })();

        /* ================= Dados ================= */
        const dialects = {
            1:    'Dialeto ICQ',
            2:    'Dialeto MSN',
            3:    'Dialeto Orkut',
            tony: 'Tony MCL'
        };

        // Cameliza as letras aleatoriamente
        function camelize(text) {
            return text.toLowerCase().split('')
                .map(c => Math.random() < 0.5 ? c.toUpperCase() : c)
                .join('');
        }

        /* ================= Tony MCL =================
           Injeta "loucuras" nas pausas do texto.
           - Pelo menos 1 por frase; quanto maior a frase, mais caótico.
           - Frases guardadas sem vírgula: a pontuação é montada conforme a posição.
           - Sorteio sem repetição (saco embaralhado) até esgotar cada categoria.
           - Só sorteia de novo no clique do botão (ver listener de input). */
        const tonyBank = {
            maconha: [
                'enquanto fumava um beck',
                'e aproveitei pra comprar haxixe',
                'chapado com meu concentrado de 99 milhões por cento de THC',
                'testando minhas 15 variedades de flor',
                'bolando um baseado'
            ],
            cu: [
                'e de repente me caguei todo',
                'detalhe: peidei molhado',
                'e nisso soltei um peido e a esposa ficou puta',
                'com o cu doendo'
            ],
            lamurias: [
                'puto porque meu bitcoin caiu',
                'e que depressão, meu pau não sobe',
                'revoltado que meu iFood tá demorando',
                'e pra piorar meu iFood tá vindo de bicicleta',
                'lembrando que minha vida é uma merda',
                'chorando de novo'
            ]
        };

        function shuffle(list) {
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            return list;
        }

        // Devolve uma função que tira itens sem repetir até esvaziar, e então reembaralha
        function makeBag(list) {
            let bag = [];
            return () => {
                if (!bag.length) bag = shuffle([...list]);
                return bag.pop();
            };
        }

        function tonyMCL(text) {
            const pick = {
                maconha: makeBag(tonyBank.maconha),
                cu: makeBag(tonyBank.cu),
                lamurias: makeBag(tonyBank.lamurias)
            };
            // Tira o conector do começo para as três frases encaixarem no jackpot
            const semE = s => s.replace(/^(e|detalhe:)\s+/i, '');

            function loucura() {
                const r = Math.random();
                if (r < 0.30) return pick.maconha();
                if (r < 0.60) return pick.cu();
                if (r < 0.90) return pick.lamurias();
                // Jackpot: as três juntas
                return pick.maconha() + ', além disso ' + semE(pick.cu()) + ' e ' + semE(pick.lamurias());
            }

            // Cada frase termina em . ! ? (ou no fim da linha); quebras de linha ficam intactas
            const injected = text.replace(/[^.!?\n]+[.!?]*/g, sentence => tonySentence(sentence, loucura));
            return tonyLinhas(injected);
        }

        // O Tony fala poucas palavras por linha: 1 a 3 palavras, cada linha começando com maiúscula.
        // Linhas em branco do texto original (parágrafos) continuam no lugar.
        function tonyLinhas(text) {
            return text.split('\n').map(line => {
                const words = line.split(/\s+/).filter(Boolean);
                const out = [];
                while (words.length) {
                    const r = Math.random();
                    let n = r < 0.3 ? 1 : r < 0.8 ? 2 : 3;
                    // frase nova sempre começa numa linha nova
                    const fim = words.findIndex(w => /[.!?]$/.test(w));
                    if (fim >= 0 && fim < n) n = fim + 1;
                    const chunk = words.splice(0, n).join(' ');
                    out.push(chunk.charAt(0).toUpperCase() + chunk.slice(1));
                }
                return out.join('\n');
            }).join('\n');
        }

        function tonySentence(sentence, loucura) {
            const [, lead, body, punct, trail] = sentence.match(/^(\s*)([\s\S]*?)([.!?]*)(\s*)$/);
            const tokens = body.split(/(\s+)/);
            const wordIdx = tokens.map((t, i) => (t && !/^\s+$/.test(t) ? i : -1)).filter(i => i >= 0);
            const w = wordIdx.length;
            if (!w) return sentence;

            // Às vezes o Tony só solta um "aiw" no começo ou um "retardado" no fim, sem loucura
            const modo = Math.random();
            if (modo < 0.15) {
                const resto = body.charAt(0).toLowerCase() + body.slice(1);
                return lead + 'Aiw, ' + resto + punct + trail;
            }
            if (modo < 0.30) {
                return lead + body.replace(/[,;:]$/, '') + ', retardado' + punct + trail;
            }

            // 1 garantida + caos que cresce mais rápido que o tamanho da frase
            const n = Math.min(w, 1 + Math.floor(Math.pow(w / 9, 1.3)));
            const chosen = shuffle([...wordIdx]).slice(0, n);
            const last = wordIdx[w - 1];

            for (const k of chosen) {
                const word = tokens[k];
                const frag = loucura();
                if (k === last) {
                    // Fim da frase: ", loucura" e depois a pontuação original
                    tokens[k] = word.replace(/[,;:]$/, '') + ', ' + frag;
                } else if (/[,;:]$/.test(word)) {
                    tokens[k] = word + ' ' + frag + ',';
                } else {
                    tokens[k] = word + ', ' + frag + ',';
                }
            }
            return lead + tokens.join('') + punct + trail;
        }

        /* ================= Motor de tradução =================
           Portado do MiGuXeiToR original (Aurelio Jargas, 2007).
           Level 1: ICQ   - Abreviações entendíveis, pouca ênfase (!!) e poucos erros
           Level 2: MSN   - Abreviações ilegíveis, muita ênfase (!!!!) e muitos erros
           Level 3: Orkut - Menos abreviações, CaMeLCaSe e muitos X por toda parte */
        function miguxar(t, level) {
            // Números
            t = t.replace(/\buma?\b/gi, '1');
            t = t.replace(/\b(dois|duas)\b/gi, '2');
            t = t.replace(/\btrês\b/gi, '3');
            t = t.replace(/\bquatro\b/gi, '4');
            t = t.replace(/\bcinco\b/gi, '5');
            t = t.replace(/\bseis\b/gi, '6');
            t = t.replace(/\bsete\b/gi, '7');
            t = t.replace(/\boito\b/gi, '8');
            t = t.replace(/\bnove\b/gi, '9');
            t = t.replace(/\bdez\b/gi, '10');
            t = t.replace(/\bonze\b/gi, '11');
            t = t.replace(/\bdoze\b/gi, '12');
            t = t.replace(/\btreze\b/gi, '13');
            t = t.replace(/\b(c|qu)atorze\b/gi, '14');
            t = t.replace(/\bquinze\b/gi, '15');
            t = t.replace(/\bdezesseis\b/gi, '16');
            t = t.replace(/\bdezessete\b/gi, '17');
            t = t.replace(/\bdezoito\b/gi, '18');
            t = t.replace(/\bdezenove\b/gi, '19');
            // Repetições
            t = t.replace(/\b([0-9]+) vez(es)?\b/gi, '$1x');
            // Horas, minutos
            t = t.replace(/\b(\d+) horas?\b/gi, '$1h');
            t = t.replace(/\b(\d+) minutos?\b/gi, '$1min');
            if (level < 3) {
                t = t.replace(/\b(\d+) segundos?\b/gi, '$1s');
            }
            // Dias da semana
            t = t.replace(/\bsegunda-feira\b/gi, '2a');
            t = t.replace(/\bterça-feira\b/gi, '3a');
            t = t.replace(/\bquarta-feira\b/gi, '4a');
            t = t.replace(/\bquinta-feira\b/gi, '5a');
            t = t.replace(/\bsexta-feira\b/gi, '6a');
            if (level < 3) {
                // Ordinais
                t = t.replace(/\bprimeir([ao])\b/gi, '1$1');
                t = t.replace(/\bsegund([ao])\b/gi, '2$1');
                t = t.replace(/\bterceir([ao])\b/gi, '3$1');
                t = t.replace(/\bquart([ao])\b/gi, '4$1');
                t = t.replace(/\bquint([ao])\b/gi, '5$1');
                t = t.replace(/\bsext([ao])\b/gi, '6$1');
                t = t.replace(/\bsétim([ao])\b/gi, '7$1');
                t = t.replace(/\boitav([ao])\b/gi, '8$1');
                t = t.replace(/\bnon([ao])\b/gi, '9$1');
                t = t.replace(/\bdécim([ao])\b/gi, '10$1');
                // Abreviações não miguxas
                t = t.replace(/\bfi(m|nal) de semana\b/gi, 'fds');
            }
            // Símbolos
            t = t.replace(/\baté mais\b/gi, 't+');
            t = t.replace(/\bdemais\b/gi, 'd+');
            t = t.replace(/\bmais ou menos\b/gi, '+-');
            t = t.replace(/\bmais\b/gi, '+');
            t = t.replace(/\bmenos\b/gi, '-');
            t = t.replace(/\bmei[ao]\b/gi, '1/2');
            // Abreviações simples
            t = t.replace(/\bpor\s?qu[eê]/gi, 'pq');
            t = t.replace(/\bhoje\b/gi, 'hj');
            t = t.replace(/\btambém\b/gi, 'tb');
            t = t.replace(/\bbeleza\b/gi, 'blz');
            t = t.replace(/\bfirmeza\b/gi, 'fmz');
            t = t.replace(/\bquando\b/gi, 'qdo');
            t = t.replace(/\bquant([ao])(s?)\b/gi, 'qt$1$2');
            t = t.replace(/\bmuit([ao])(s?)\b/gi, 'mt$1$2');
            t = t.replace(/\bbeij(o|ão)\b/gi, 'bj$1');
            t = t.replace(/\bbeijos\b/gi, 'bjs');
            if (level == 1) {
                t = t.replace(/\bcom([^\wáéíóúàâêôãõüç]|$)/gi, 'c/$1');
            } else if (level == 3) {
                t = t.replace(/\bcom([^\wáéíóúàâêôãõüç]|$)/gi, 'cum$1');
            }
            if (level > 1) {
                // Abreviações avançadas
                t = t.replace(/\bmesm[ao](s?)\b/gi, 'msm$1');
                t = t.replace(/\bdepois\b/gi, 'dpois');
                t = t.replace(/\bquem\b/gi, 'qm');
                t = t.replace(/\bcomigo\b/gi, 'cmg');
                t = t.replace(/\bcadê/gi, 'kd');
                t = t.replace(/\bqualquer\b/gi, 'qq');
                t = t.replace(/\bfalou\b/gi, 'flw');
                t = t.replace(/\bvaleu\b/gi, 'vlw');
                t = t.replace(/\btchau\b/gi, 'xau');
            }
            if (level == 1) {
                t = t.replace(/\bque\b/gi, 'q');
                t = t.replace(/\bvocê/gi, 'vc');
                t = t.replace(/\be-?mail(s?)\b/gi, 'mail$1');
            } else if (level == 2) {
                t = t.replace(/\bque\b/gi, 'ke');
                t = t.replace(/\bvocês\b/gi, '6');
                t = t.replace(/\bvocê/gi, 'vc');
            } else {
                t = t.replace(/\bque\b/gi, 'ki');
                t = t.replace(/\b(adoro você|te adoro)/gi, 'adoluxê');
                t = t.replace(/\bamo vocês\b/gi, 'amodolu vocês');
                t = t.replace(/\b(amo você|te amo)/gi, 'te amodolu');
                t = t.replace(/\bvocê/gi, 'vuxê');
            }
            // Glossário
            t = t.replace(/\btecl(e|ar|ou|amos)\b/gi, 'tc');
            t = t.replace(/\binternet\b/gi, 'net');
            t = t.replace(/\be-?mail(s?)\b/gi, 'meio$1');
            t = t.replace(/\b(grana|dinheiro)\b/gi, '$$$$$$'); // $$$
            if (level == 2) {
                t = t.replace(/\badicion/gi, 'adde');
                t = t.replace(/\bamig([ao])\b/gi, 'mig$1');
                t = t.replace(/\blind([ao])\b/gi, 'leend$1');
                t = t.replace(/\bnovidade(s?)\b/gi, '9dad$1');
            } else if (level == 3) {
                t = t.replace(/\badicion[\wáí]+/gi, 'add');
                t = t.replace(/\bamig([ao]s?)\b/gi, 'migux$1');
                t = t.replace(/\blind([ao]s?)\b/gi, 'lindux$1');
                t = t.replace(/\bfof([ao]s?)\b/gi, 'fofux$1');
                t = t.replace(/\bdormir\b/gi, 'mimir');
                t = t.replace(/\bnome(s?)\b/gi, 'nominho$1');
                t = t.replace(/\besposa\b/gi, 'marida');
                t = t.replace(/\b(de novo|novamente)\b/gi, 'dinovo');
                t = t.replace(/\b(aliás|por exemplo)\b/gi, 'tipo assim');
            }
            // tou, tava, tar
            t = t.replace(/\best(ar|ou|ava|ive|aria|ão)\b/gi, 't$1');
            t = t.replace(/\bestá([^\wáéíóúàâêôãõüç]|$)/gi, 'tah$1');
            // para
            t = t.replace(/\bpara ([ao]s?)\b/gi, 'pr$1');
            t = t.replace(/\bpara([^\wáéíóúàâêôãõüç-]|$)/gi, 'pra$1');
            if (level == 2) {
                t = t.replace(/\bpr[ao]([^\wáéíóúàâêôãõüç]|$)/gi, 'p$1');
            }
            // Simplifica: irmos -> ir, acabou -> cabou
            t = t.replace(/([aei]r)mos\b/gi, '$1');
            t = t.replace(/\bacab/gi, 'cab');
            if (level > 1) {
                // entaum, naum
                t = t.replace(/ão\b/gi, 'aum');
                // andando -> andano
                t = t.replace(/(\w[aei])ndo\b/gi, '$1no');
                // tadeenha, foteenha, gateenha
                t = t.replace(/(\w[crt]ad)([ao])\b/gi, '$1eenh$2');
                t = t.replace(/foto(s?)\b/gi, 'foteenha$1');
                t = t.replace(/(\w)tinh([ao])\b/gi, '$1teenh$2');
                if (level > 2) {
                    // No Orkut é mais fófi terminar em i
                    t = t.replace(/\bse\b/gi, 'si');
                    t = t.replace(/\bde\b/gi, 'di');
                    t = t.replace(/\bte\b/gi, 'ti');
                } else {
                    // No MSN o som da letra vira a palavra
                    t = t.replace(/\bse\b/gi, 'c');
                    t = t.replace(/\bde\b/gi, 'd');
                    t = t.replace(/\bte\b/gi, 't');
                }
                // CH, SH e QU não existem
                t = t.replace(/ch/gi, 'x');
                t = t.replace(/sh/gi, 'x');
                t = t.replace(/qu/gi, 'k');
                // e -> i (alguns casos)
                t = t.replace(/(\w(ss|[cdgtv]))e(s?)m?\b/gi, '$1i$3');
                t = t.replace(/\bseg/gi, 'sig');
                t = t.replace(/\bdes([^s])/gi, 'dis$1');
            }
            // ei -> i (deixa -> dexa)
            t = t.replace(/eix/gi, 'ex');
            if (level > 1) {
                t = t.replace(/\bbonit/gi, 'bunit');
                // e sozinho -> i
                t = t.replace(/\be\b/gi, 'i');
                if (level > 2) {
                    t = t.replace(/ês\b/gi, 'eix');
                    t = t.replace(/(\w)(ás|az)\b/gi, '$1aix');
                }
            }
            // Acento no final eh moh uoh
            t = t.replace(/á([^\wáéíóúàâêôãõüç]|$)/gi, 'ah$1');
            t = t.replace(/é([^\wáéíóúàâêôãõüç]|$)/gi, 'eh$1');
            t = t.replace(/í([^\wáéíóúàâêôãõüç]|$)/gi, 'ih$1');
            t = t.replace(/ó([^\wáéíóúàâêôãõüç]|$)/gi, 'oh$1');
            t = t.replace(/ú([^\wáéíóúàâêôãõüç]|$)/gi, 'uh$1');
            // Acentuação? Nunca.
            t = t.replace(/[áàâãä]/gi, 'a');
            t = t.replace(/[éèêë]/gi, 'e');
            t = t.replace(/[íìîï]/gi, 'i');
            t = t.replace(/[óòôõö]/gi, 'o');
            t = t.replace(/[úùûü]/gi, 'u');
            if (level == 1) {
                t = t.replace(/[ç]/gi, 'c');
            } else {
                t = t.replace(/[ç]/gi, 'ss');
            }
            if (level > 1) {
                // l$ -> u
                t = t.replace(/(\w[a-z])l\b/gi, '$1u');
                // amo -> amu, todo -> todu
                t = t.replace(/o(s?)\b/gi, 'u$1');
                t = t.replace(/\b(\d+)u\b/gi, '$1o');
                // ou -> o
                if (level == 3) {
                    t = t.replace(/(\w)ou\b/gi, '$1ow');
                } else {
                    t = t.replace(/(\w)ou\b/gi, '$1o');
                }
                t = t.replace(/\bou(\w)/gi, 'o$1');
                t = t.replace(/(\w)ou(\w)/gi, '$1o$2');
                // ^c -> k
                t = t.replace(/\bc([^ei\W])/gi, 'k$1');
                // andar -> andah, comer -> come, sentir -> senti
                t = t.replace(/ar\b/gi, 'ah');
                t = t.replace(/er\b/gi, 'e');
                t = t.replace(/ir\b/gi, 'i');
                // eira$ -> era
                t = t.replace(/eira\b/gi, 'era');
                // casa -> caza
                t = t.replace(/([^s\W])sa\b/gi, '$1za');
            }
            if (level > 2) {
                // O abominável X no fim das palavras no plural
                t = t.replace(/([^\Ws])s\b/gi, '$1x');
                // O abominável H no fim de certas palavras
                t = t.replace(/(\w)a\b/gi, '$1ah');
            }
            // Risada
            if (level == 1) {
                t = t.replace(/\b(he|ha|hi|ho|hua){2,}h?\b/gi, 'rsrsrs');
            } else if (level == 2) {
                t = t.replace(/\b(he|ha|hi|ho|hua|rs){2,}h?\b/gi, 'huahuahua');
                t = t.replace(/[8:][-o]?[D)]/g, 'huahuahua');
            } else {
                t = t.replace(/\b(he|ha|hi|ho|hua|rs){2,}h?\b/gi, 'kkkkkkkkkkk');
                t = t.replace(/[8:][-o]?[D)]/g, 'kkkkkkkkkkk');
            }
            if (level > 1) {
                // Pontos são mais legais... vários...
                t = t.replace(/\./g, '......');
                t = t.replace(/, /g, '...');
                t = t.replace(/,(\n|$)/g, '...$1');
            }
            // Sejamos enfáticos!!!
            if (level == 1) {
                t = t.replace(/!/g, '!!');
                t = t.replace(/\?/g, '??');
            } else {
                t = t.replace(/!/g, '!!!!!');
                t = t.replace(/\?/g, '??!?!');
            }
            if (level < 3) {
                t = t.toLowerCase();
            } else {
                t = camelize(t);
                t = t.replace(/x/gi, 'xXx');
                t = t.replace(/ss/gi, 'XX');
            }
            return t;
        }

        /* ================= Modo reverso =================
           Tenta voltar do dialeto para o português. É aproximado: o miguxês
           perde acentos, ç, maiúsculas e números por extenso, então a volta
           usa um dicionário e regras por dialeto. No Tony MCL a volta é exata:
           as loucuras são frases conhecidas e saem inteiras. */

        const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        // Remove as loucuras do Tony (inclusive o jackpot) e arruma a pontuação que sobra
        function desTony(t) {
            // Junta as linhas curtas do Tony de volta numa frase só. A maiúscula do começo
            // de cada linha vira minúscula, a não ser depois de ponto final, ! ou ?.
            // Linhas em branco (parágrafos) ficam.
            t = t.split('\n').reduce((acc, line, i, all) => {
                if (i === 0) return line;
                const prev = all[i - 1];
                if (!line.trim() || !prev.trim()) return acc + '\n' + line;
                const keep = /[.!?]\s*$/.test(prev);
                return acc + ' ' + (keep ? line : line.charAt(0).toLowerCase() + line.slice(1));
            }, '');
            const frags = Object.values(tonyBank).flat();
            const variants = new Set();
            for (const f of frags) {
                variants.add(f);
                variants.add(f.replace(/^(e|detalhe:)\s+/i, ''));
            }
            const alt = [...variants].sort((a, b) => b.length - a.length).map(escapeRe).join('|');
            const combo = `(?:${alt})(?:,\\s*além disso\\s+(?:${alt})\\s+e\\s+(?:${alt}))?`;
            // ", loucura," no meio some inteira; ", loucura" antes da pontuação também
            t = t.replace(new RegExp(`,\\s*${combo}\\s*,(?!\\s*além disso)`, 'gi'), '');
            t = t.replace(new RegExp(`,?\\s*${combo}(?=\\s*(?:[.!?]|$|\\n))`, 'gim'), '');
            t = t.replace(new RegExp(`\\s*${combo},?`, 'gi'), '');
            // "Aiw, " no começo da frase e ", retardado" no fim
            t = t.replace(/(^|[.!?]\s+|\n)aiw,?\s+(\S)/gi, (m, pre, c) => pre + c.toUpperCase());
            t = t.replace(/,?\s*retardado(?=\s*(?:[.!?]|$|\n))/gim, '');
            return t;
        }

        // Palavras inteiras (antes das regras de sufixo). Ordem importa.
        const REVERSO_PALAVRAS = [
            ['vc', 'você'], ['vcs', 'vocês'], ['vuxe', 'você'], ['vuxê', 'você'],
            ['pq', 'porque'], ['tb', 'também'], ['tbm', 'também'], ['hj', 'hoje'],
            ['blz', 'beleza'], ['fmz', 'firmeza'], ['qdo', 'quando'], ['qd', 'quando'],
            ['qto', 'quanto'], ['qta', 'quanta'], ['qtos', 'quantos'], ['qtas', 'quantas'],
            ['mto', 'muito'], ['mta', 'muita'], ['mtos', 'muitos'], ['mtas', 'muitas'],
            ['mtu', 'muito'], ['mtus', 'muitos'], ['qtu', 'quanto'], ['qtus', 'quantos'],
            ['bjo', 'beijo'], ['bju', 'beijo'], ['bjs', 'beijos'], ['bjão', 'beijão'], ['bjaum', 'beijão'],
            ['msm', 'mesmo'], ['msma', 'mesma'], ['dpois', 'depois'], ['qm', 'quem'],
            ['cmg', 'comigo'], ['kmg', 'comigo'], ['kd', 'cadê'], ['qq', 'qualquer'], ['flw', 'falou'],
            ['vlw', 'valeu'], ['xau', 'tchau'], ['fds', 'fim de semana'], ['tc', 'teclar'],
            ['net', 'internet'], ['meio', 'e-mail'], ['meios', 'e-mails'], ['mail', 'e-mail'],
            ['q', 'que'], ['ke', 'que'], ['ki', 'que'], ['c/', 'com'], ['cum', 'com'], ['kom', 'com'],
            ['tah', 'está'], ['ta', 'tá'], ['to', 'tô'], ['tou', 'tô'], ['tava', 'estava'],
            ['eh', 'é'], ['naum', 'não'], ['nao', 'não'], ['entaum', 'então'], ['entao', 'então'],
            ['adoluxe', 'adoro você'], ['adoluxê', 'adoro você'], ['amodolu', 'amo'],
            ['mimir', 'dormir'], ['dinovo', 'de novo'], ['marida', 'esposa'],
            ['add', 'adicionar'], ['addeando', 'adicionando'],
            ['huahuahua', 'haha'], ['rsrsrs', 'haha'], ['rs', 'haha'],
            ['voce', 'você'], ['voces', 'vocês'], ['tambem', 'também'], ['ja', 'já'], ['so', 'só'],
            ['eu', 'eu']
        ];
        // Palavras que só valem para um dialeto (o mesmo símbolo significa outra coisa nos outros)
        const REVERSO_POR_NIVEL = {
            1: [],
            2: [['6', 'vocês'], ['d', 'de'], ['c', 'se'], ['t', 'te'], ['p', 'para'], ['i', 'e'], ['u', 'o'], ['us', 'os']],
            3: [['si', 'se'], ['di', 'de'], ['ti', 'te'], ['i', 'e'], ['u', 'o'], ['us', 'os']]
        };

        function trocarPalavras(t, pares) {
            for (const [de, para] of pares) {
                const re = new RegExp(`(^|[^\\wÀ-ÿ/])${escapeRe(de)}(?=$|[^\\wÀ-ÿ/])`, 'gi');
                t = t.replace(re, (m, pre) => pre + para);
            }
            return t;
        }

        function capitalizarFrases(t) {
            t = t.replace(/^(\s*[-–]?\s*)([a-zà-ÿ])/gm, (m, a, b) => a + b.toUpperCase());
            return t.replace(/([.!?]\s+)([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
        }

        function desmiguxar(t, level) {
            if (level === 'tony') return desTony(t);
            const n = Number(level);

            if (n === 3) {
                // desfaz o CaMeLcAsE e os enfeites
                t = t.toLowerCase();
                t = t.replace(/xxx/g, 'x').replace(/xx/g, 'ss');
            } else {
                t = t.toLowerCase();
            }

            // Pontuação exagerada
            t = t.replace(/(\?!?)+\?*!*/g, '?').replace(/!{2,}/g, '!');
            if (n > 1) {
                t = t.replace(/\.{6,}/g, '.');
                t = t.replace(/\.{3,5}(?=\S)/g, ', ').replace(/\.{3,5}/g, ',');
            }

            // Risadas e símbolos
            t = t.replace(/\bk{4,}\b/g, 'haha');
            t = t.replace(/(^|\s)t\+(?=\s|$|[.,!?])/g, '$1até mais');
            t = t.replace(/(^|\s)d\+(?=\s|$|[.,!?])/g, '$1demais');
            t = t.replace(/(^|\s)\+-(?=\s|$|[.,!?])/g, '$1mais ou menos');
            t = t.replace(/(^|\s)\+(?=\s|$|[.,!?])/g, '$1mais');
            t = t.replace(/(^|\s)1\/2(?=\s|$|[.,!?])/g, '$1meio');
            t = t.replace(/\b(\d+)x\b/g, '$1 vezes');
            t = t.replace(/\b(\d+)h\b/g, '$1 horas').replace(/\b(\d+)min\b/g, '$1 minutos');

            if (n === 3) {
                t = t.replace(/(\w*[a-wyz])x\b/g, '$1s'); // plural com X: bjx -> bjs
            }
            if (n > 1) {
                // amu -> amo, tudu -> tudo (só depois de consoante, para não mexer em "seu", "meu")
                t = t.replace(/(\w*[bcdfgjlmnpqrstvxz])u(s?)\b/g, '$1o$2');
                t = t.replace(/(\w)iu\b/g, '$1io'); // veiu -> veio
                // Sufixos e trocas do MSN/Orkut (antes do dicionário)
                t = t.replace(/aum\b/g, 'ão');
                t = t.replace(/eenh([ao]s?)\b/g, 'inh$1');
                t = t.replace(/foteenha(s?)\b/g, 'foto$1');
                t = t.replace(/\bmigux([ao]s?)\b/g, 'amig$1').replace(/\bmig([ao]s?)\b/g, 'amig$1');
                t = t.replace(/\blindux([ao]s?)\b/g, 'lind$1').replace(/\bleend([ao]s?)\b/g, 'lind$1');
                t = t.replace(/\bfofux([ao]s?)\b/g, 'fof$1');
                t = t.replace(/\bnominho(s?)\b/g, 'nome$1');
                t = t.replace(/\b9dad(e?s?)\b/g, 'novidade$1').replace(/\badde/g, 'adicion');
                t = t.replace(/\bbunit/g, 'bonit');
                t = t.replace(/\bk(?=[aou])/g, 'c');
            }
            if (n === 3) {
                t = t.replace(/ow\b/g, 'ou');
                t = t.replace(/eix\b/g, 'ês').replace(/(\w)aix\b/g, '$1ás');
                t = t.replace(/(\w{2,})ah\b/g, '$1a');
            }

            t = trocarPalavras(t, REVERSO_POR_NIVEL[n] || []);
            t = trocarPalavras(t, REVERSO_PALAVRAS);

            if (n === 2) {
                // no MSN os verbos em -ar viraram -ah
                t = t.replace(/(\w{2,})ah\b/g, '$1ar');
            }
            if (n > 1) {
                t = t.replace(/\bk(?=[ei])/g, 'qu'); // keru -> quero
                t = t.replace(/(\w(?:ss|[cdgtv]))i(s?)\b/g, '$1e$2'); // saudadi -> saudade, genti -> gente
            }

            return capitalizarFrases(t);
        }

        /* ================= Interface ================= */
        const input = document.getElementById('inputText');
        const output = document.getElementById('outputText');
        const outPane = document.getElementById('outPane');
        const dialectLabel = document.getElementById('dialectLabel');
        const consoleEl = document.querySelector('.console');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');
        const count = document.getElementById('count');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const audioBtn = document.getElementById('audioBtn');
        const zapTextBtn = document.getElementById('zapTextBtn');
        const zapAudioBtn = document.getElementById('zapAudioBtn');
        const audioBar = document.getElementById('audioBar');
        const player = document.getElementById('player');
        const channels = [...document.querySelectorAll('.channel[data-level]')];

        // Voz gerada pela API do TonyZator (ElevenLabs), cópia na conta sabor-uvas. Limite de 500 caracteres por áudio.
        const TTS_URL = 'https://tonyzator-voz.netlify.app/api/tts';
        const TTS_MAX = 500;
        let currentAudio = null; // { url, file, text }

        let activeLevel = null;
        let currentText = '';
        let scrambleId = 0;
        let reverse = false; // false: português -> dialeto; true: dialeto -> português
        function translate(level, text) {
            if (reverse) return desmiguxar(text, level);
            return level === 'tony' ? tonyMCL(text) : miguxar(text, Number(level));
        }

        // Títulos das caixas e do topo conforme direção e dialeto
        function updateTitles(level) {
            const dialeto = level === 'tony' || level == null ? 'Tonyzês' : 'Miguxês';
            document.getElementById('inTitle').textContent = reverse ? dialeto : 'Português';
            document.getElementById('outTitle').textContent = reverse ? 'Português' : dialeto;
            document.getElementById('brandName').textContent = level == null || level === 'tony' ? 'Tonyzês' : 'MiGuXeiToR';
            input.placeholder = reverse
                ? 'Cole aqui o texto no dialeto e aperte um botão.'
                : 'Digite aqui seu texto e aperte um botão.';
        }

        function showState(kind, icon, message) {
            scrambleId++;
            currentText = '';
            output.className = 'output ' + kind;
            output.innerHTML = '<span class="empty"><i class="ph ' + icon + '"></i></span>';
            output.firstChild.append(message);
            copyBtn.disabled = true;
            clearAudio();
        }

        function showText(text, animate) {
            currentText = text;
            output.className = 'output';
            copyBtn.disabled = false;
            // O áudio antigo não vale mais para um texto novo
            if (currentAudio && currentAudio.text !== text) clearAudio();
            updateShareButtons();
            const id = ++scrambleId;

            if (!animate || reduceMotion) {
                output.textContent = text;
                return;
            }

            // Efeito de decodificação: o texto "chega" da transmissão
            const glyphs = 'x#%&*+=<>/\\|01kKXx?!';
            const duration = Math.min(900, 280 + text.length * 3);
            const start = performance.now();
            outPane.classList.remove('decoding');
            void outPane.offsetWidth;
            outPane.classList.add('decoding');

            function frame(now) {
                if (id !== scrambleId) return;
                const p = Math.min(1, (now - start) / duration);
                const eased = 1 - Math.pow(1 - p, 3);
                const shown = Math.floor(eased * text.length);
                let noise = '';
                const tail = Math.min(28, text.length - shown);
                for (let i = 0; i < tail; i++) {
                    const c = text[shown + i];
                    noise += (c === '\n' || c === ' ') ? c : glyphs[(Math.random() * glyphs.length) | 0];
                }
                output.textContent = text.slice(0, shown) + noise;
                if (p < 1) requestAnimationFrame(frame);
                else output.textContent = text;
            }
            requestAnimationFrame(frame);
        }

        function run(level, animate = true) {
            activeLevel = level;
            channels.forEach(c => c.setAttribute('aria-pressed', String(c.dataset.level === String(level))));
            consoleEl.classList.toggle('mode-tony', level === 'tony');
            dialectLabel.textContent = dialects[level];
            updateTitles(level);

            if (!input.value.trim()) {
                showState('is-error', 'ph-warning', 'ERRO: Insira dados na interface primária, rebelde.');
                return;
            }
            showText(translate(level, input.value), animate);
        }

        function reset() {
            activeLevel = null;
            channels.forEach(c => c.setAttribute('aria-pressed', 'false'));
            consoleEl.classList.remove('mode-tony');
            dialectLabel.textContent = '';
            updateTitles(null);
            showState('is-empty', 'ph-broadcast', 'Escolha um dialeto abaixo para decodificar a transmissão.');
        }

        function updateCount() {
            const n = input.value.length;
            count.textContent = n + (n === 1 ? ' caractere' : ' caracteres');        }

        channels.forEach(c => c.addEventListener('click', () => run(c.dataset.level)));

        // Tradução ao vivo enquanto digita, depois de escolher um dialeto
        let typingTimer;
        input.addEventListener('input', () => {
            updateCount();
            // Tony MCL só sorteia de novo no clique do botão
            // (no modo reverso o Tony é determinístico, então pode traduzir ao vivo)
            if (!activeLevel || (activeLevel === 'tony' && !reverse)) return;
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => run(activeLevel, false), 140);
        });

        // Modo reverso: inverte a direção. Se já há tradução, ela vai para a caixa da esquerda.
        const flowBtn = document.getElementById('flowBtn');
        flowBtn.addEventListener('click', () => {
            reverse = !reverse;
            flowBtn.setAttribute('aria-pressed', String(reverse));
            document.getElementById('flowFrom').textContent = reverse ? 'Dialeto' : 'Português';
            document.getElementById('flowTo').textContent = reverse ? 'Português' : 'Dialeto';
            document.getElementById('flowHint').textContent = reverse ? 'Modo reverso ligado' : 'Modo reverso desligado';
            if (currentText) {
                input.value = currentText;
                updateCount();
            }
            if (activeLevel && input.value.trim()) run(activeLevel);
            else updateTitles(activeLevel);
        });

        // Apaga tudo e começa de novo
        resetBtn.addEventListener('click', () => {
            input.value = '';
            reset();
            updateCount();
            input.focus();
        });

        let toastTimer;
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
        }

        /* ---------- Áudio ---------- */
        function updateShareButtons() {
            audioBtn.disabled = !currentText || audioBtn.classList.contains('is-loading');
            zapTextBtn.disabled = !currentText;
            zapAudioBtn.disabled = !currentAudio;
        }

        function clearAudio() {
            if (currentAudio) URL.revokeObjectURL(currentAudio.url);
            currentAudio = null;
            player.pause();
            player.removeAttribute('src');
            audioBar.hidden = true;
            updateShareButtons();
        }

        async function generateAudio() {
            const text = currentText.trim();
            if (!text) return;
            if (text.length > TTS_MAX) {
                showToast(`O áudio aceita até ${TTS_MAX} caracteres. Esse texto tem ${text.length}.`);
                return;
            }
            const label = audioBtn.querySelector('.name');
            audioBtn.classList.add('is-loading');
            audioBtn.querySelector('.glyph i').className = 'ph ph-circle-notch';
            label.textContent = 'Gerando...';
            updateShareButtons();
            try {
                const res = await fetch(TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.audio) throw new Error(data.error || 'Não deu para gerar o áudio.');
                const bytes = Uint8Array.from(atob(data.audio), c => c.charCodeAt(0));
                const file = new File([bytes], 'tonyzes.mp3', { type: 'audio/mpeg' });
                clearAudio();
                currentAudio = { url: URL.createObjectURL(file), file, text: currentText };
                player.src = currentAudio.url;
                audioBar.hidden = false;
                player.play().catch(() => {});
            } catch (err) {
                // fetch falha sem mensagem quando a API está fora do ar ou bloqueia o site
                showToast(err instanceof TypeError ? 'Não deu para falar com o gerador de áudio agora.' : err.message);
            } finally {
                audioBtn.classList.remove('is-loading');
                audioBtn.querySelector('.glyph i').className = 'ph ph-speaker-high';
                label.textContent = 'TonyZator';
                updateShareButtons();
            }
        }
        audioBtn.addEventListener('click', generateAudio);

        /* ---------- WhatsApp ---------- */
        zapTextBtn.addEventListener('click', () => {
            if (!currentText) return;
            window.open('https://wa.me/?text=' + encodeURIComponent(currentText), '_blank', 'noopener');
        });

        zapAudioBtn.addEventListener('click', async () => {
            if (!currentAudio) return;
            const { file } = currentAudio;
            // Celular: abre a folha de compartilhar do sistema, com o WhatsApp na lista
            if (navigator.canShare?.({ files: [file] })) {
                try { await navigator.share({ files: [file], title: 'Tonyzês' }); }
                catch (err) { if (err.name !== 'AbortError') showToast('Não deu para compartilhar.'); }
                return;
            }
            // Computador: baixa o MP3 e abre o WhatsApp Web para anexar
            const a = document.createElement('a');
            a.href = currentAudio.url;
            a.download = file.name;
            a.click();
            showToast('Áudio baixado! Anexa ele na conversa do WhatsApp.');
            window.open('https://web.whatsapp.com/', '_blank', 'noopener');
        });

        copyBtn.addEventListener('click', async () => {
            if (!currentText) return;
            try {
                await navigator.clipboard.writeText(currentText);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = currentText;
                document.body.append(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            }
            showToast('Copiado');
        });

        // Atalhos: 1 a 4 escolhem o dialeto (fora da caixa de texto)
        document.addEventListener('keydown', e => {
            if (e.target === input || e.ctrlKey || e.metaKey || e.altKey) return;
            const map = { '1': '1', '2': '2', '3': '3', '4': 'tony' };
            if (map[e.key]) run(map[e.key]);
        });

        updateCount();
    </script>
</body>
</html>
